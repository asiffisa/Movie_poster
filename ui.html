<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Movie Poster Plugin</title>
  <style>
    :root {
      --font-stack: Inter;
      font-family: var(--font-stack);

      --space-1: 12px;
      /* base */
      --space-2: 16px;
      --space-3: 28px;
      --header-height: 48px;

      --bg: #F2EBFA;
      --divider: #E1DAEA;
      --text: #111111;

      --chip-active-stroke: #5719A3;
      --chip-active-border: #DEBEF8;
      --chip-active-fill: #EADCF9;
      --soft-accent: #E8D8F8;
      --dropdown-stroke: #E0C6F6;
      --chip-inactive-stroke: #D9CFE3;
      --chip-inactive-fill: #F8F4FD;

      --poster-radius: 16px;
      --card-radius: 22px;

      /* Shared SVG placeholder URL for better performance and file size */
      --placeholder-url: url('data:image/svg+xml;utf8,<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20.0004 12L22.6671 4ZM9.33374 12L12.0004 4ZM1.33374 12H30.6671ZM4.53374 4H27.4671C27.8873 4 28.3034 4.08277 28.6917 4.24359C29.0799 4.4044 29.4327 4.64011 29.7298 4.93726C30.027 5.23441 30.2627 5.58717 30.4235 5.97541C30.5843 6.36365 30.6671 6.77977 30.6671 7.2V24.8C30.6671 25.6487 30.3299 26.4626 29.7298 27.0627C29.1297 27.6629 28.3158 28 27.4671 28H4.53374C3.68505 28 2.87111 27.6629 2.271 27.0627C1.67088 26.4626 1.33374 25.6487 1.33374 24.8V7.2C1.33374 6.77977 1.41651 6.36365 1.57733 5.97541C1.73814 5.58717 1.97385 5.23441 2.271 4.93726C2.87111 4.33714 3.68505 4 4.53374 4Z" fill="%23EEE7F8"/><path d="M20.0004 12L22.6671 4ZM9.33374 12L12.0004 4M1.33374 12H30.6671M4.53374 4H27.4671C27.8873 4 28.3034 4.08277 28.6917 4.24359C29.0799 4.4044 29.4327 4.64011 29.7298 4.93726C30.027 5.23441 30.2627 5.58717 30.4235 5.97541C30.5843 6.36365 30.6671 6.77977 30.6671 7.2V24.8C30.6671 25.6487 30.3299 26.4626 29.7298 27.0627C29.1297 27.6629 28.3158 28 27.4671 28H4.53374C3.68505 28 2.87111 27.6629 2.271 27.0627C1.67088 26.4626 1.33374 25.6487 1.33374 24.8V7.2C1.33374 6.77977 1.41651 6.36365 1.57733 5.97541C1.73814 5.58717 1.97385 5.23441 2.271 4.93726C2.87111 4.33714 3.68505 4 4.53374 4Z" fill="%23EEE7F8" stroke="%23BEA8DA" stroke-width="2.28571" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/></svg>');
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-stack);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 0;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 140;
      height: var(--header-height);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-2);
      background: var(--bg);
      border-bottom: 1px solid var(--divider);
    }

    .toolbar .left {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .toolbar .title {
      font-size: 20px;
      font-weight: 700
    }

    .toolbar button {
      border: 0;
      background: transparent;
      padding: 6px;
      cursor: pointer
    }

    /* chips bar (sticky under header) */
    .chips-bar {
      position: sticky;
      top: 60px;
      z-index: 130;
      background: var(--bg);
      padding: 4px 4px 8px 16px;
      border-bottom: 1px solid transparent
    }

    .chips {
      display: flex;
      gap: 12px
    }

    .chip {
      padding: 8px 14px;
      border-radius: 60px;
      border: 1.6px solid var(--chip-inactive-stroke);
      background: var(--chip-inactive-fill);
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .chip.active {
      border-color: var(--chip-active-border);
      background: var(--chip-active-fill);
      color: var(--chip-active-stroke); /* Use #5719A3 for active text */
    }

    /* content canvas */
    .canvas {
      flex: 1;
      overflow: auto;
      padding: 24px 16px 24px 16px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 500;
      margin: 18px 0 12px 0
    }

    /* action cards */
    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 8px
    }

    .action-card {
      background:
        linear-gradient(to bottom, #F1E5FA 0%, #FBF5FF 40%, #FFFFFF 100%) padding-box,
        linear-gradient(to bottom, #C3B3D2 0%, #DED6EB 100%) border-box;
      border-radius: var(--card-radius);
      padding: 12px;
      padding-left: 16px;
      border: 1.6px solid transparent;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      cursor: pointer
    }

    .action-card .icon {
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .action-card .icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain
    }

    .action-card .label {
      font-size: 16px;
      font-weight: 600;
      line-height: 20px;
      color: var(--text)
    }

    /* trending grid */
    .trendingHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
      margin: 44px 0 16px
    }

    .rail-dropdown {
      position: relative;
      display: inline-block;
      max-width: calc(100vw - 32px)
    }

    .rail-select {
      width: fit-content;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      max-width: calc(100vw - 32px);
      border: 1px solid var(--dropdown-stroke);
      border-radius: 999px;
      padding: 12px 36px 12px 16px;
      background: #FFFFFF;
      background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' viewBox='0 0 16 16' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3 5.5L8 10.5L13 5.5' stroke='%23111111' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px 16px;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
    }

    .rail-label {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .rail-label-icon {
      flex: 0 0 auto;
    }

    .rail-label-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .rail-select:focus {
      outline: none;
      border-color: var(--dropdown-stroke);
      box-shadow: none
    }

    .rail-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      z-index: 20;
      display: none;
      padding: 4px 4px 4px 4px;
      border: 1px solid var(--soft-accent);
      border-radius: 12px;
      background: #FFFFFF
    }

    .rail-menu.open {
      display: flex;
      flex-direction: column;
      gap: 4px
    }

    .rail-option {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-weight: 500;
      text-align: left;
      white-space: nowrap;
      cursor: pointer
    }

    .rail-option:hover,
    .rail-option[aria-selected="true"] {
      background: var(--chip-active-fill);
      color: var(--chip-active-stroke)
    }

    .trendingGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 16px
    }

    .thumb {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .thumb .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: var(--poster-radius);
      overflow: hidden;
      background: #E7D8F4;
      position: relative;
      background-image: var(--placeholder-url);
      background-repeat: no-repeat;
      background-position: 53% 53%;
      background-size: 40px 40px;
    }

    .thumb .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: var(--poster-radius);
      will-change: transform;
      backface-visibility: hidden
    }

    .thumb .poster::after {
      content: '';
      position: absolute;
      inset: 42% 0 0;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(transparent, rgba(17, 17, 17, .68));
      transition: opacity 140ms ease
    }

    .thumb .poster.has-alternatives:hover::after,
    .thumb .poster.has-alternatives:focus-within::after {
      opacity: 1
    }

    .poster-shuffle {
      position: absolute;
      right: 10px;
      bottom: 10px;
      z-index: 2;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #FFFFFF;
      opacity: 0;
      pointer-events: none;
      cursor: pointer;
      transition: opacity 140ms ease
    }

    /* Keep the poster unobstructed when the shuffle control receives focus. */
    .poster-shuffle:focus,
    .poster-shuffle:focus-visible,
    .poster-shuffle:active {
      outline: 2px solid transparent;
      outline-offset: 0;
      box-shadow: none;
      background: transparent
    }

    .poster.has-alternatives:hover .poster-shuffle,
    .poster.has-alternatives:focus-within .poster-shuffle,
    .poster-shuffle:focus-visible {
      opacity: 1;
      pointer-events: auto
    }

    .poster-shuffle svg {
      width: 22px;
      height: 22px
    }

    .poster-shuffle.is-loading {
      cursor: progress
    }

    .thumb .meta {
      font-size: 12px;
      color: #3a3340
    }

    .thumb .meta > div + div {
      margin-top: 2px
    }

    .thumb .meta .year {
      font-size: 10px
    }

    .rail-hint {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 20px 0 4px;
      color: #A58CB6;
      font-size: 12px;
      line-height: 16px;
    }

    .rail-hint-icon {
      width: 14px;
      height: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 14px;
    }

    .rail-hint-icon svg {
      width: 14px;
      height: 14px;
    }

    /* loading placeholders */
    .placeholder-card {
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #E7D8F4;
      border-radius: var(--poster-radius);
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: var(--placeholder-url);
      background-repeat: no-repeat;
      background-position: 53% 53%;
      background-size: 40px 40px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.7; }
      100% { opacity: 1; }
    }



    /* search view top */
    .search-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px
    }

    .input-wrap {
      flex: 1;
      background: #fff;
      border: 2px solid rgba(187, 145, 238);
      padding: 16px 52px 16px 16px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative
    }

    .input-wrap input {
      border: 0;
      outline: 0;
      font-size: 16px;
      width: 100%;
      background: transparent
    }

    .clear-button {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      padding: 0;
      display: none;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #5719A3;
      cursor: pointer
    }

    .clear-button.visible {
      display: inline-flex
    }

    .clear-button svg {
      width: 18px;
      height: 18px
    }

    /* empty state large */

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 12px;
      color: #777
    }

    /* empty state helper text (size adjustable) */
    .empty-state .empty-note {
      color: #BDAAD6;
      margin-top: 4px;
      font-size: 18px;
      /* <-- change this value to control size */
      line-height: 1.3;
      text-align: center;
    }

    /* small helpers */
    .snack {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 20px;
      background: #111;
      color: #fff;
      padding: 10px 12px;
      border-radius: 10px;
      display: none;
      align-items: center;
      gap: 10px;
      z-index: 1200;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      transition: opacity .22s ease, transform .18s ease;
      opacity: 0;
      transform: translateY(6px);
    }

    .snack[style*="display:flex"] {
      /* when visible */
      opacity: 1;
      transform: translateY(0);
    }

    .snack-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center
    }

    .snack-text {
      flex: 1;
      text-align: left;
      font-size: 15px
    }

    /* focus */
    button:focus,
    .chip:focus,
    .action-card:focus {
      outline: 2px solid #BB91EE;
      outline-offset: 2px
    }

    /* responsive small widths: collapse to 2 cols */
    @media (max-width:420px) {
      .trendingGrid {
        grid-template-columns: repeat(2, 1fr)
      }

      .actions-row {
        grid-template-columns: 1fr
      }
    }
  </style>
</head>

        info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="#9AA0A6" stroke-width="1.2" fill="#F3F4F6"/><path d="M12 8v.01" stroke="#6B7280" stroke-width="1.6" stroke-linecap="round"/><path d="M11 11h2v4h-2z" fill="#6B7280"/></svg>',
        shuffle: SHUFFLE_ICON_SVG,
        none: ''
      };
      if (iconType === 'none') { icon.style.display = 'none'; } else { icon.style.display = 'block'; icon.innerHTML = svgs[iconType] || svgs.info; }
      s.style.display = 'flex'; s.style.opacity = '1';
      clearTimeout(s._t);
      s._t = setTimeout(() => { s.style.opacity = '0'; setTimeout(() => { s.style.display = 'none'; }, 220); }, duration);
    }

    /* ---------- elements ---------- */
    const chipMovie = document.getElementById('chip-movie');
    const chipTv = document.getElementById('chip-tv');
    const railToggle = document.getElementById('railToggle');
    const railLabel = document.getElementById('railLabel');
    const railMenu = document.getElementById('railMenu');
    let activeRail = 'trending-week';
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const resultsEl = document.getElementById('searchResultsGrid');
    const searchEmpty = document.getElementById('searchEmpty');
    const headerBack = document.getElementById('headerBack');
    const headerClose = document.getElementById('headerClose');
    const headerIcon = document.getElementById('headerIcon');
    const cardSearch = document.getElementById('card-search');
    const cardRandom = document.getElementById('card-random');
    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="300" viewBox="0 0 200 300">' +
      '<rect width="100%" height="100%" rx="12" ry="12" fill="#E7D8F4"/>' +
      '<g transform="translate(84, 120)">' +
      '<path d="M20.0004 12L22.6671 4ZM9.33374 12L12.0004 4ZM1.33374 12H30.6671ZM4.53374 4H27.4671C27.8873 4 28.3034 4.08277 28.6917 4.24359C29.0799 4.4044 29.4327 4.64011 29.7298 4.93726C30.027 5.23441 30.2627 5.58717 30.4235 5.97541C30.5843 6.36365 30.6671 6.77977 30.6671 7.2V24.8C30.6671 25.6487 30.3299 26.4626 29.7298 27.0627C29.1297 27.6629 28.3158 28 27.4671 28H4.53374C3.68505 28 2.87111 27.6629 2.271 27.0627C1.67088 26.4626 1.33374 25.6487 1.33374 24.8V7.2C1.33374 6.77977 1.41651 6.36365 1.57733 5.97541C1.73814 5.58717 1.97385 5.23441 2.271 4.93726C2.87111 4.33714 3.68505 4 4.53374 4Z" fill="#EEE7F8"/>' +
      '<path d="M20.0004 12L22.6671 4M9.33374 12L12.0004 4M1.33374 12H30.6671M4.53374 4H27.4671C27.8873 4 28.3034 4.08277 28.6917 4.24359C29.0799 4.4044 29.4327 4.64011 29.7298 4.93726C30.027 5.23441 30.2627 5.58717 30.4235 5.97541C30.5843 6.36365 30.6671 6.77977 30.6671 7.2V24.8C30.6671 25.6487 30.3299 26.4626 29.7298 27.0627C29.1297 27.6629 28.3158 28 27.4671 28H4.53374C3.68505 28 2.87111 27.6629 2.271 27.0627C1.67088 26.4626 1.33374 25.6487 1.33374 24.8V7.2C1.33374 6.77977 1.41651 6.36365 1.57733 5.97541C1.73814 5.58717 1.97385 5.23441 2.271 4.93726C2.87111 4.33714 3.68505 4 4.53374 4Z" fill="#EEE7F8" stroke="#BEA8DA" stroke-width="2.28571" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</g><text x="50%" y="182" fill="#BEA8DA" font-family="Inter" font-size="20" font-weight="500" text-anchor="middle" dominant-baseline="middle">No image</text></svg>'
    );

    // Function to show loading placeholders in trending grid
    function showLoadingPlaceholders(container) {
      if (!container) return;
      container.innerHTML = '';
      const frag = document.createDocumentFragment();
      for (let i = 0; i < 6; i++) {
        const placeholder = document.createElement('div');
        placeholder.className = 'placeholder-card';
        frag.appendChild(placeholder);
      }
      container.appendChild(frag);
    }

    function setActiveChip(type) {
      mediaType = type;
      chipMovie.classList.toggle('active', type === 'movie');
      chipTv.classList.toggle('active', type === 'tv');
      const si = document.getElementById('searchInput');
      if (si) si.placeholder = (type === 'tv') ? 'Search tv shows (eg: dahmer)' : 'Search movies (eg: sinners)';
      updateRailOptions();
      requestRail();

      // If user is in search view with a query, refresh search results
      if (si && si.value && si.value.trim().length >= MIN_QUERY_LEN) {
        doLiveSearch(si.value.trim());
      }
    }
    chipMovie.addEventListener('click', () => setActiveChip('movie'));
    chipTv.addEventListener('click', () => setActiveChip('tv'));

    // header close/back
    function showHeaderBack(show) {
      if (headerBack) headerBack.style.display = show ? 'inline-flex' : 'none';
      if (headerIcon) headerIcon.style.display = show ? 'none' : 'inline-flex';
    }
    if (headerBack) headerBack.addEventListener('click', () => { // go back to home
      document.getElementById('searchView').style.display = 'none'; document.getElementById('homeView').style.display = 'block'; showHeaderBack(false);
    });
    if (headerClose) headerClose.addEventListener('click', () => parent.postMessage({ pluginMessage: { type: 'close' } }, '*'));

    /* ---------- action cards wiring ---------- */
    cardSearch && cardSearch.addEventListener('click', () => { // open search screen
      document.getElementById('homeView').style.display = 'none'; document.getElementById('searchView').style.display = 'block'; showHeaderBack(true); searchInput && searchInput.focus();
    });
    cardSearch && cardSearch.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cardSearch.click(); } });

    cardRandom && cardRandom.addEventListener('click', () => { parent.postMessage({ pluginMessage: { type: 'random-pick', mediaType } }, '*'); });
    cardRandom && cardRandom.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cardRandom.click(); } });

    /* ---------- search + results handling ---------- */
    function posterKey(mediaTypeValue, id) {
      return `${mediaTypeValue}:${id}`;
    }

    function previewPosterUrl(path) {
      return 'https://image.tmdb.org/t/p/w500' + path;
    }

    function uniquePosterPaths(currentPath, alternatives) {
      const seen = new Set();
      return [currentPath].concat(alternatives || []).filter((path) => {
        if (!path || seen.has(path)) return false;
        seen.add(path);
        return true;
      });
    }

    function posterVariants(cell, alternatives) {
      return uniquePosterPaths(cell.dataset.originalPosterPath, alternatives);
    }

    function cyclePoster(cell, img, variants) {
      const currentIndex = variants.indexOf(cell.dataset.posterPath);
      const nextIndex = currentIndex >= 0 ? (currentIndex + 1) % variants.length : 0;
      const isCycling = currentIndex === variants.length - 1;
      const nextPath = variants[nextIndex];
      cell.dataset.posterPath = nextPath;
      img.src = previewPosterUrl(nextPath);
      img.removeAttribute('srcset');
      const introKey = posterKey(cell.dataset.mediaType, cell.dataset.mediaId);
      if (!shuffleIntroShown.has(introKey)) {
        shuffleIntroShown.add(introKey);
        showSnack(`Showing other posters of ${cell.dataset.title || 'this title'}`, 'shuffle', 3000);
      }
      if (isCycling) showSnack('All posters for this title have been shown. Starting again.', 'info', 3000);
    }

    function addShuffleControl(cell, posterWrap, img) {
      if (!cell.dataset.posterPath || posterWrap.querySelector('.poster-shuffle')) return;
      posterWrap.classList.add('has-alternatives');
      const shuffle = document.createElement('button');
      shuffle.type = 'button';
      shuffle.className = 'poster-shuffle';
      shuffle.setAttribute('aria-label', 'Choose an alternative poster');
      shuffle.setAttribute('title', 'Choose an alternative poster');
      shuffle.innerHTML = SHUFFLE_ICON_SVG;
      shuffle.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        const key = posterKey(cell.dataset.mediaType, cell.dataset.mediaId);
        const alternatives = posterAlternatives.get(key);
        const variants = posterVariants(cell, alternatives);
        if (alternatives && variants.length >= 2) {
          cyclePoster(cell, img, variants);
          return;
        }

        cell.dataset.shuffleRequested = 'true';
        shuffle.disabled = true;
        shuffle.classList.add('is-loading');
        requestPosterAlternatives(cell, posterWrap, img);
      });
      posterWrap.appendChild(shuffle);
    }

    function updateShuffleAvailability(cell, posterWrap, img, alternatives) {
      const variants = posterVariants(cell, alternatives);
      const shuffle = posterWrap.querySelector('.poster-shuffle');
      if (variants.length < 2) {
        posterWrap.classList.remove('has-alternatives');
        if (shuffle) shuffle.remove();
        delete cell.dataset.shuffleRequested;
        return;
      }

      addShuffleControl(cell, posterWrap, img);
      const control = posterWrap.querySelector('.poster-shuffle');
      if (control) {
        control.disabled = false;
        control.classList.remove('is-loading');
      }
      if (cell.dataset.shuffleRequested === 'true') {
        delete cell.dataset.shuffleRequested;
        cyclePoster(cell, img, variants);
      }
    }

    function requestPosterAlternatives(cell, posterWrap, img) {
      const id = Number(cell.dataset.mediaId);
      const mediaTypeValue = cell.dataset.mediaType;
      if (!id || !mediaTypeValue || !cell.dataset.posterPath) return;
      const key = posterKey(mediaTypeValue, id);
      if (posterAlternatives.has(key)) {
        updateShuffleAvailability(cell, posterWrap, img, posterAlternatives.get(key));
        return;
      }
      if (pendingPosterAlternatives.has(key)) return;
      pendingPosterAlternatives.add(key);
      parent.postMessage({ pluginMessage: { type: 'get-poster-alternatives', mediaType: mediaTypeValue, id } }, '*');
    }

    function formatMediaLabel(titleLine, title, year) {
      titleLine.appendChild(document.createTextNode(year ? `${title} \u00B7 ` : title));
      if (year) {
        const yearPart = document.createElement('span');
        yearPart.style.color = '#817788';
        yearPart.textContent = year;
        titleLine.appendChild(yearPart);
      }
    }

    function applyPosterAlternatives(mediaTypeValue, id, paths) {
      const key = posterKey(mediaTypeValue, id);
      const alternatives = Array.isArray(paths) ? paths : [];
      posterAlternatives.set(key, alternatives);
      pendingPosterAlternatives.delete(key);
      document.querySelectorAll('.thumb').forEach((cell) => {
        if (cell.dataset.mediaId !== String(id) || cell.dataset.mediaType !== mediaTypeValue) return;
        const posterWrap = cell.querySelector('.poster');
        const img = posterWrap && posterWrap.querySelector('img');
        if (posterWrap && img) updateShuffleAvailability(cell, posterWrap, img, alternatives);
      });
    }

    function renderGrid(container, items) {
      // fast exit
      container = container || document.getElementById('trendingGrid');
      container.innerHTML = '';
      if (!items || !items.length) return;

      const frag = document.createDocumentFragment();

      items.forEach(it => {
        const cell = document.createElement('div');
        cell.className = 'thumb';
        // Store data for event delegation
        cell.dataset.posterPath = it.poster_path || '';
        cell.dataset.originalPosterPath = it.poster_path || '';
        cell.dataset.title = it.title || it.name || '';
        cell.dataset.mediaId = it.id ? String(it.id) : '';
        cell.dataset.mediaType = it.mediaType || mediaType;

        const posterWrap = document.createElement('div');
        posterWrap.className = 'poster';

        const img = document.createElement('img');
        img.alt = it.title || it.name || 'poster';
        // prefer smaller image for thumbnails with srcset for responsiveness
        if (it.poster_full) {
          img.src = it.poster_full;
        } else if (it.poster_path) {
          img.src = 'https://image.tmdb.org/t/p/w500' + it.poster_path;
          img.srcset = 'https://image.tmdb.org/t/p/w200' + it.poster_path + ' 200w, https://image.tmdb.org/t/p/w500' + it.poster_path + ' 500w';
          img.sizes = '(max-width:420px) 45vw, 30vw';
        } else {
          img.src = PLACEHOLDER;
        }

        // performance hints
        img.loading = 'lazy';
        img.decoding = 'async';

        // fallback to placeholder on error
        const onErr = () => { if (img.src !== PLACEHOLDER) img.src = PLACEHOLDER; img.removeEventListener('error', onErr); };
        img.addEventListener('error', onErr);

        posterWrap.appendChild(img);
        addShuffleControl(cell, posterWrap, img);
        const cachedAlternatives = posterAlternatives.get(posterKey(cell.dataset.mediaType, Number(cell.dataset.mediaId)));
        if (cachedAlternatives) updateShuffleAvailability(cell, posterWrap, img, cachedAlternatives);

        // compute display title and year
        const displayTitle = it.title || it.name || '';
        const year = (it.release_date || it.first_air_date || '').slice(0, 4) || '';

        const meta = document.createElement('div');
        meta.className = 'meta';

        const titleLine = document.createElement('div');
        formatMediaLabel(titleLine, displayTitle, year);
        meta.appendChild(titleLine);

        cell.appendChild(posterWrap);
        cell.appendChild(meta);
        frag.appendChild(cell);
      });

      container.appendChild(frag);

      if (container.id === 'trendingGrid' && items.length >= 21) {
        const hint = document.createElement('div');
        hint.className = 'rail-hint';
        hint.setAttribute('role', 'note');

        const hintIcon = document.createElement('span');
        hintIcon.className = 'rail-hint-icon';
        hintIcon.setAttribute('aria-hidden', 'true');
        hintIcon.innerHTML = SHUFFLE_ICON_SVG;

        const hintText = document.createElement('span');
        hintText.textContent = 'Hover over a poster, then click shuffle to change it';

        hint.appendChild(hintIcon);
        hint.appendChild(hintText);
        container.appendChild(hint);
      }
    }

    // Download the original poster in the controller; this avoids a lossy canvas/JPEG re-encode.
    function handleGridClick(e) {
      const cell = e.target.closest('.thumb');
      if (!cell) return;
      const posterPath = cell.dataset.posterPath;
      const title = cell.dataset.title || 'Poster';
      if (!posterPath) {
        showSnack('No image available', 'info', 2000);
        return;
      }
      showSnack('⬇️ Fetching: ' + title, 'none', 30000);
      parent.postMessage({ pluginMessage: { type: 'insert-poster', posterPath, title } }, '*');
    }

    // Attach delegation listeners
    document.getElementById('trendingGrid').addEventListener('click', handleGridClick);
    document.getElementById('searchResultsGrid').addEventListener('click', handleGridClick);

    window.onmessage = (event) => {
      const payload = (event.data && event.data.pluginMessage) || event.data;
      if (!payload) return;
      const msg = payload;
      if (msg.type === 'trending-results') {
        const items = msg.items || msg.results || [];
        requestAnimationFrame(() => renderGrid(document.getElementById('trendingGrid'), items));
      }
      else if (msg.type === 'poster-alternatives') {
        applyPosterAlternatives(msg.mediaType, msg.id, msg.posterPaths);
      }
      else if (msg.type === 'search-results') {
        const items = msg.items || msg.results || [];
        const grid = resultsEl;
        if (items.length) { 
          searchEmpty.style.display = 'none'; 
          grid.style.display = 'grid'; 
          // Cache results
          searchCache.set(`${mediaType}:${msg.query}`, items);
          requestAnimationFrame(() => renderGrid(grid, items)); 
        }
        else { 
          searchEmpty.style.display = 'flex'; 
          grid.style.display = 'none'; 
          grid.innerHTML = ''; 
          searchCache.delete(`${mediaType}:${msg.query}`);
        }
      }
      else if (msg.type === 'snackbar') {
        showSnack(msg.message || '', 'info', msg.duration || 2000);
      }
      else if (msg.type === 'inserted') {
        showSnack(msg.message || 'Added!', 'success', 2200);
      }
      else if (msg.type === 'no-selection') {
        showSnack(msg.message || 'Click the frame, and then click poster', 'frame', 2800);
      }
      else if (msg.type === 'error') {
        showSnack(msg.message || 'Something went wrong', 'error', 3500);
      }
      else if (msg.type === 'clear-search') {
        resultsEl.innerHTML = '';
        searchEmpty.style.display = 'flex';
        resultsEl.style.display = 'none';
      }
    };

    /* live search wiring */
    /* live search wiring with caching */
    function doLiveSearch(q) { 
      if (!q || q.length < MIN_QUERY_LEN) { 
        parent.postMessage({ pluginMessage: { type: 'clear-search' } }, '*'); 
        return; 
      } 
      
      const cacheKey = `${mediaType}:${q}`;
      if (searchCache.has(cacheKey)) {
        const cachedResults = searchCache.get(cacheKey);
        searchEmpty.style.display = 'none';
        resultsEl.style.display = 'grid';
        renderGrid(resultsEl, cachedResults);
        return;
      }

      parent.postMessage({ pluginMessage: { type: 'live-search', mediaType, query: q } }, '*'); 
    }
    const debouncedLive = debounce((e) => doLiveSearch((e.target.value || '').trim()), 350);
    searchInput && searchInput.addEventListener('input', debouncedLive);

    function updateClearButton() {
      if (!clearSearchBtn || !searchInput) return;
      clearSearchBtn.classList.toggle('visible', searchInput.value.length > 0);
    }

    searchInput && searchInput.addEventListener('input', updateClearButton);
    clearSearchBtn && clearSearchBtn.addEventListener('click', () => {
      if (!searchInput) return;
      searchInput.value = '';
      updateClearButton();
      parent.postMessage({ pluginMessage: { type: 'clear-search' } }, '*');
      searchEmpty.style.display = 'flex';
      resultsEl.style.display = 'none';
      resultsEl.innerHTML = '';
      searchInput.focus();
    });
    updateClearButton();

    const railLabels = {
      movie: {
        'trending-week': '🗓️ Trending movies this week',
        popular: '⭐ Popular movies',
        upcoming: '🔭 Upcoming movies',
        'top-rated': '🏆 Top rated movies'
      },
      tv: {
        'trending-week': '🗓️ Trending TV shows this week',
        popular: '⭐ Popular TV shows',
        'top-rated': '🏆 Top rated TV shows'
      }
    };

    function setRailMenu(open) {
      if (!railToggle || !railMenu) return;
      railMenu.classList.toggle('open', open);
      railToggle.setAttribute('aria-expanded', String(open));
    }

    function renderRailLabel(element, label) {
      if (!element) return;
      const separatorIndex = label.indexOf(' ');
      const icon = separatorIndex >= 0 ? label.slice(0, separatorIndex) : '';
      const text = separatorIndex >= 0 ? label.slice(separatorIndex + 1) : label;
      element.textContent = '';
      element.classList.add(element === railLabel ? 'rail-label' : 'rail-option-label');

      if (icon) {
        const iconElement = document.createElement('span');
        iconElement.className = 'rail-label-icon';
        iconElement.setAttribute('aria-hidden', 'true');
        iconElement.textContent = icon;
        element.appendChild(iconElement);
      }

      const textElement = document.createElement('span');
      textElement.className = 'rail-label-text';
      textElement.textContent = text;
      element.appendChild(textElement);
    }

    function fitRailToggle() {
      if (!railToggle || !railLabel) return;
      const measure = document.createElement('span');
      const computed = window.getComputedStyle(railToggle);
      measure.textContent = railLabel.textContent || '';
      measure.style.position = 'absolute';
      measure.style.visibility = 'hidden';
      measure.style.whiteSpace = 'nowrap';
      measure.style.font = computed.font;
      measure.style.fontWeight = computed.fontWeight;
      document.body.appendChild(measure);
      const horizontalPadding = parseFloat(computed.paddingLeft) + parseFloat(computed.paddingRight);
      const borderWidth = parseFloat(computed.borderLeftWidth) + parseFloat(computed.borderRightWidth);
      const labelGap = parseFloat(window.getComputedStyle(railLabel).gap) || 0;
      const desiredWidth = Math.ceil(measure.getBoundingClientRect().width) + labelGap + horizontalPadding + borderWidth;
      measure.remove();
      // The canvas has 16px padding on both sides. Use its full usable width
      // so the label stays on one line instead of being constrained by a child.
      const availableWidth = Math.max(0, window.innerWidth - 32);
      railToggle.style.width = `${Math.min(desiredWidth, availableWidth)}px`;
      if (railMenu) railMenu.style.minWidth = railToggle.style.width;
    }

    function updateRailOptions() {
      const labels = railLabels[mediaType];
      if (!labels[activeRail]) activeRail = 'trending-week';
      renderRailLabel(railLabel, labels[activeRail]);
      if (railMenu) {
        railMenu.innerHTML = '';
        Object.keys(labels).forEach((value) => {
          const option = document.createElement('button');
          option.type = 'button';
          option.className = 'rail-option';
          option.setAttribute('role', 'option');
          option.setAttribute('aria-selected', String(value === activeRail));
          renderRailLabel(option, labels[value]);
          option.addEventListener('click', () => {
            activeRail = value;
            updateRailOptions();
            setRailMenu(false);
            requestRail();
            if (railToggle) railToggle.focus();
          });
          railMenu.appendChild(option);
        });
      }
      fitRailToggle();
      requestAnimationFrame(fitRailToggle);
    }

    function requestRail() {
      showLoadingPlaceholders(document.getElementById('trendingGrid'));
      parent.postMessage({ pluginMessage: { type: 'get-trending', mediaType, rail: activeRail } }, '*');
    }

    railToggle && railToggle.addEventListener('click', () => {
      setRailMenu(!railMenu || !railMenu.classList.contains('open'));
    });
    document.addEventListener('click', (event) => {
      const dropdown = railToggle && railToggle.parentElement;
      if (dropdown && !dropdown.contains(event.target)) setRailMenu(false);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') {
        setRailMenu(false);
        if (railToggle) railToggle.focus();
      }
    });
    window.addEventListener('resize', fitRailToggle);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitRailToggle);
    updateRailOptions();

    // initial request for the selected discovery rail
    requestRail();
    parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
  </script>
